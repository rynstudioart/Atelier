<!doctype html>
<html lang="ro">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Atelier — Interior Design Studio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>

  <style>

    :root {
      --black: #242220;
      --gray: #77736d;
      --light-gray: #e9e7e3;
      --very-light: #f8f7f5;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: var(--black);
      font-family: "DM Sans", sans-serif;
    }

    h1,
    h2,
    h3,
    .elegant-title {
      font-family: "Cormorant Garamond", serif;
      font-weight: 500;
    }


    /* --------------------------------
       MAIN PAGE
    -------------------------------- */

    #main-view {
      min-height: 100vh;
      background: #ffffff;
    }

    .main-header {
      text-align: center;
      padding-top: 70px;
      margin-bottom: 45px;
    }

    .logo {
      font-family: "DM Sans", sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #242220;
      margin-bottom: 24px;
    }

    .main-title {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(48px, 7vw, 72px);
      line-height: 0.95;
      font-weight: 500;
      letter-spacing: -0.025em;
      margin: 0;
    }

    .main-subtitle {
      margin-top: 13px;
      font-size: 13px;
      color: var(--gray);
      letter-spacing: 0.04em;
    }


    /* --------------------------------
       NEW PROJECT BUTTON
    -------------------------------- */

    .new-project-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 55px;
    }

    .new-project-button {
      display: inline-flex;
      align-items: center;
      gap: 10px;

      background: #242220;
      color: white;

      border: none;
      border-radius: 999px;

      padding: 14px 27px;

      font-size: 13px;
      font-weight: 500;

      transition: all .2s ease;
      cursor: pointer;
    }

    .new-project-button:hover {
      background: #3c3935;
      transform: translateY(-1px);
    }


    /* --------------------------------
       ADD PROJECT FORM
    -------------------------------- */

    .add-project-form {
      max-width: 420px;
      margin: 0 auto 45px;
    }

    .add-project-form input {
      width: 100%;
      border: 1px solid var(--light-gray);
      border-radius: 10px;
      padding: 13px 15px;
      outline: none;
      font-size: 13px;
      background: white;
    }

    .add-project-form input:focus {
      border-color: #aaa69f;
    }


    /* --------------------------------
       PROJECT GRID
    -------------------------------- */

    #projects-grid {
      padding-bottom: 100px;
    }

    .project-card {
      position: relative;
      background: white;
      border: 1px solid var(--light-gray);
      border-radius: 15px;
      overflow: hidden;
      cursor: pointer;
      transition: all .25s ease;
    }

    .project-card:hover {
      border-color: #d0cdc7;
      transform: translateY(-3px);
      box-shadow: 0 15px 35px rgba(0,0,0,.06);
    }

    .project-cover {
      width: 100%;
      height: 230px;
      background: #f3f2ef;
      overflow: hidden;
    }

    .project-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .4s ease;
    }

    .project-card:hover .project-cover img {
      transform: scale(1.03);
    }

    .project-card-content {
      padding: 20px;
    }

    .project-card-title {
      font-family: "Cormorant Garamond", serif;
      font-size: 25px;
      font-weight: 500;
      margin-bottom: 5px;
    }

    .project-card-info {
      color: #88847d;
      font-size: 12px;
    }

    .project-card-status {
      display: inline-block;
      margin-top: 13px;
      padding: 5px 9px;
      border-radius: 999px;
      background: #f4f2ef;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #6e6a64;
    }


    /* --------------------------------
       DETAIL VIEW
    -------------------------------- */

    #detail-view {
      min-height: 100vh;
      background: white;
    }

    .detail-header {
      padding: 35px 0 45px;
      border-bottom: 1px solid var(--light-gray);
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #77736d;
      font-size: 12px;
      border: none;
      background: transparent;
      padding: 0;
      margin-bottom: 30px;
      cursor: pointer;
    }

    .back-button:hover {
      color: #242220;
    }

    .detail-title {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(42px, 6vw, 64px);
      line-height: 1;
      margin: 0;
    }

    .detail-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 25px;
      margin-top: 17px;
      color: #817d76;
      font-size: 12px;
    }

    .detail-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 28px;
    }

    .action-button {
      border: 1px solid var(--light-gray);
      background: white;
      border-radius: 999px;
      padding: 9px 15px;
      font-size: 12px;
      color: #44413d;
      transition: .2s;
      cursor: pointer;
    }

    .action-button:hover {
      background: #f7f6f3;
    }

    .action-button.dark {
      background: #242220;
      color: white;
      border-color: #242220;
    }


    /* --------------------------------
       SECTION
    -------------------------------- */

    .project-section {
      padding: 60px 0;
      border-bottom: 1px solid var(--light-gray);
    }

    .section-number {
      font-size: 10px;
      color: #99958e;
      letter-spacing: .18em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .section-title {
      font-family: "Cormorant Garamond", serif;
      font-size: 34px;
      margin: 0;
    }


    /* --------------------------------
       SECTION HEADER + PLUS
    -------------------------------- */

    .section-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    .section-header-left {
      min-width: 0;
    }

    .section-add-button {
      flex: 0 0 auto;

      width: 42px;
      height: 42px;

      border-radius: 50%;

      border: 1px solid #d8d5cf;
      background: white;

      color: #77736d;

      font-size: 24px;
      font-weight: 300;

      line-height: 1;

      cursor: pointer;

      transition: all .2s ease;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .section-add-button:hover {
      background: #242220;
      color: white;
      border-color: #242220;
      transform: translateY(-1px);
    }


    /* --------------------------------
       IMAGE GRID
    -------------------------------- */

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 0;
    }

    .photo-item {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: #f5f4f1;
      aspect-ratio: 1;
      cursor: pointer;
    }

    .photo-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .3s ease;
    }

    .photo-item:hover img {
      transform: scale(1.04);
    }


    /* --------------------------------
       SKETCH + RENDER
       HORIZONTAL SCROLL
    -------------------------------- */

    .horizontal-scroll-grid {
      display: flex;

      gap: 16px;

      overflow-x: auto;
      overflow-y: hidden;

      padding-bottom: 12px;

      scroll-behavior: smooth;

      scrollbar-width: thin;
      scrollbar-color: #c8c5bf transparent;
    }

    .horizontal-scroll-grid::-webkit-scrollbar {
      height: 6px;
    }

    .horizontal-scroll-grid::-webkit-scrollbar-track {
      background: transparent;
    }

    .horizontal-scroll-grid::-webkit-scrollbar-thumb {
      background: #c8c5bf;
      border-radius: 20px;
    }

    .horizontal-scroll-grid .photo-item {
      flex: 0 0 520px;

      width: 520px;
      height: 330px;

      aspect-ratio: auto;
    }


    /* --------------------------------
       TECHNICAL DRAWINGS
    -------------------------------- */

    .technical-drawings-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }


    /* --------------------------------
       REMOVE PHOTO
    -------------------------------- */

    .remove-photo {
      position: absolute;

      top: 7px;
      right: 7px;

      width: 25px;
      height: 25px;

      border-radius: 50%;
      border: none;

      background: rgba(20,20,20,.75);
      color: white;

      display: none;

      align-items: center;
      justify-content: center;

      font-size: 12px;

      cursor: pointer;

      z-index: 3;
    }

    .photo-item:hover .remove-photo {
      display: flex;
    }


    /* --------------------------------
       PALETTE
    -------------------------------- */

    .palette {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    .color-item {
      text-align: center;
      width: 85px;
    }

    .color-circle {
      width: 70px;
      height: 70px;
      margin: 0 auto 8px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,.08);
    }

    .color-name {
      font-size: 11px;
      color: #5f5b55;
    }

    .color-code {
      font-size: 9px;
      color: #aaa69f;
      margin-top: 3px;
    }


    /* --------------------------------
       MATERIAL CARDS
    -------------------------------- */

    .material-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .material-card {
      border: 1px solid var(--light-gray);
      border-radius: 14px;
      overflow: hidden;
      background: white;
    }

    .material-image {
      height: 180px;
      background: #f3f2ef;
    }

    .material-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .material-content {
      padding: 15px;
    }

    .material-title {
      font-family: "Cormorant Garamond", serif;
      font-size: 21px;
    }

    .material-info {
      color: #89857e;
      font-size: 11px;
      margin-top: 4px;
    }


    /* --------------------------------
       MODAL
    -------------------------------- */

    .modal {
      position: fixed;
      inset: 0;

      z-index: 100;

      display: none;

      align-items: center;
      justify-content: center;

      background: rgba(25,23,21,.45);

      padding: 20px;
    }

    .modal.active {
      display: flex;
    }

    .modal-box {
      width: min(560px, 100%);

      max-height: 90vh;

      overflow-y: auto;

      background: white;

      border-radius: 18px;

      padding: 28px;

      box-shadow: 0 25px 80px rgba(0,0,0,.15);
    }

    .modal-title {
      font-family: "Cormorant Garamond", serif;

      font-size: 31px;

      margin-bottom: 22px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;

      font-size: 10px;

      text-transform: uppercase;

      letter-spacing: .1em;

      color: #85817a;

      margin-bottom: 7px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;

      border: 1px solid var(--light-gray);

      border-radius: 9px;

      padding: 11px 12px;

      font-size: 13px;

      outline: none;

      background: white;
    }

    .form-group textarea {
      min-height: 100px;

      resize: vertical;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: #aaa69f;
    }

    .modal-actions {
      display: flex;

      justify-content: flex-end;

      gap: 8px;

      margin-top: 22px;
    }


    /* --------------------------------
       FULL IMAGE POPUP
    -------------------------------- */

    .image-modal {
      position: fixed;

      inset: 0;

      z-index: 9999;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 30px;

      background: rgba(20,18,16,.88);
    }

    .image-modal.active {
      display: flex;
    }

    .image-modal-content {
      position: relative;

      max-width: 95vw;
      max-height: 92vh;

      display: flex;

      align-items: center;
      justify-content: center;
    }

    .image-modal-content img {
      max-width: 95vw;
      max-height: 92vh;

      width: auto;
      height: auto;

      object-fit: contain;

      border-radius: 6px;

      box-shadow: 0 20px 80px rgba(0,0,0,.3);
    }

    .image-modal-close {
      position: fixed;

      top: 25px;
      right: 30px;

      width: 42px;
      height: 42px;

      border: none;
      border-radius: 50%;

      background: rgba(255,255,255,.12);

      color: white;

      font-size: 25px;

      cursor: pointer;

      display: flex;

      align-items: center;
      justify-content: center;

      z-index: 10000;
    }

    .image-modal-close:hover {
      background: rgba(255,255,255,.22);
    }


    /* --------------------------------
       TOAST
    -------------------------------- */

    #toast {
      position: fixed;

      bottom: 25px;
      right: 25px;

      background: #242220;

      color: white;

      padding: 11px 17px;

      border-radius: 999px;

      font-size: 12px;

      opacity: 0;

      transform: translateY(10px);

      pointer-events: none;

      transition: .25s;

      z-index: 200;
    }

    #toast.show {
      opacity: 1;

      transform: translateY(0);
    }


    /* --------------------------------
       MOBILE
    -------------------------------- */

    @media(max-width:700px) {

      .main-header {
        padding-top: 45px;
      }

      .photo-grid,
      .technical-drawings-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .material-grid {
        grid-template-columns: 1fr;
      }

      .detail-meta {
        gap: 12px;
      }

      .project-section {
        padding: 45px 0;
      }

      .project-cover {
        height: 210px;
      }

      .horizontal-scroll-grid .photo-item {
        flex: 0 0 85vw;

        width: 85vw;

        height: 55vw;
      }

    }

  </style>
</head>


<body>


<!-- =====================================================
     HOME
===================================================== -->

<div id="main-view">

  <main class="max-w-5xl mx-auto px-6">

    <header class="main-header">

      <div class="logo">
        ATELIER
      </div>

      <h1 class="main-title">
        My Projects
      </h1>

      <p class="main-subtitle">
        Interior Design Studio
      </p>

    </header>


    <div class="new-project-wrapper">

      <button
        class="new-project-button"
        onclick="showAddProject()"
      >

        <span style="font-size:18px;">
          +
        </span>

        New Project

      </button>

    </div>


    <div
      id="add-project-form"
      class="add-project-form hidden"
    >

      <div class="flex gap-2">

        <input
          id="new-project-name"
          type="text"
          placeholder="Nume proiect..."
          onkeydown="if(event.key==='Enter') createProject()"
        >

        <button
          onclick="createProject()"
          class="action-button dark"
        >
          Create
        </button>

        <button
          onclick="hideAddProject()"
          class="action-button"
        >
          Cancel
        </button>

      </div>

    </div>


    <div
      id="projects-grid"
      class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-5 pb-24"
    ></div>

  </main>

</div>



<!-- =====================================================
     DETAIL VIEW
===================================================== -->

<div
  id="detail-view"
  class="hidden"
>

  <main class="max-w-5xl mx-auto px-6">

    <header class="detail-header">

      <button
        onclick="goBack()"
        class="back-button"
      >

        <i data-lucide="arrow-left"></i>

        Back to projects

      </button>


      <h1
        id="detail-project-name"
        class="detail-title"
      ></h1>


      <div
        id="detail-meta"
        class="detail-meta"
      ></div>


      <div class="detail-actions">

        <button
          onclick="saveLocal()"
          class="action-button"
        >
          Save
        </button>


        <button
          onclick="openProjectEdit()"
          class="action-button"
        >
          Edit Project
        </button>


        <button
          onclick="previewClient()"
          class="action-button"
        >
          Preview Client
        </button>


        <button
          onclick="exportHTML()"
          class="action-button dark"
        >
          Export Interactive HTML
        </button>


        <button
          onclick="exportJSON()"
          class="action-button"
        >
          Export JSON
        </button>

      </div>

    </header>


    <div
      id="sections-container"
    ></div>

  </main>

</div>



<!-- =====================================================
     ADD / EDIT MODAL
===================================================== -->

<div
  id="modal"
  class="modal"
  onclick="closeModalOutside(event)"
>

  <div
    id="modal-box"
    class="modal-box"
  ></div>

</div>



<!-- =====================================================
     IMAGE FULLSCREEN POPUP
===================================================== -->

<div
  id="image-modal"
  class="image-modal"
  onclick="closeImageModal(event)"
>

  <button
    class="image-modal-close"
    onclick="closeImageModal(event)"
  >
    ×
  </button>


  <div class="image-modal-content">

    <img
      id="image-modal-img"
      src=""
      alt="Preview"
      onclick="event.stopPropagation()"
    >

  </div>

</div>



<div id="toast"></div>



<script>
/* =====================================================
   ATELIER — INTERIOR DESIGN STUDIO
   STORAGE + INDEXEDDB + IMAGE LIGHTBOX
===================================================== */
const STORAGE_KEY = "atelier-interior-projects";
const DB_NAME = "atelier-interior-images";
const DB_VERSION = 1;
const IMAGE_STORE = "images";
const SECTION_TYPES = [
  "Moodboard",
  "Sketch",
  "Reference",
  "Texture",
  "Palette Color",
  "Materials",
  "Furniture",
  "Technical Drawings",
  "Lighting",
  "Render Drawings",
  "Notes"
];
let projects =
  JSON.parse(
    localStorage.getItem(STORAGE_KEY) || "[]"
  );
let currentProject = null;
let dbPromise = null;
/* =====================================================
   INDEXED DB
===================================================== */
function openImageDB() {
  if (dbPromise) {
    return dbPromise;
  }
  dbPromise = new Promise(
    (resolve, reject) => {
      const request =
        indexedDB.open(
          DB_NAME,
          DB_VERSION
        );
      request.onupgradeneeded =
        function(event) {
          const db =
            event.target.result;
          if (
            !db.objectStoreNames.contains(
              IMAGE_STORE
            )
          ) {
            db.createObjectStore(
              IMAGE_STORE,
              {
                keyPath: "id"
              }
            );
          }
        };
      request.onsuccess =
        function(event) {
          resolve(
            event.target.result
          );
        };
      request.onerror =
        function() {
          console.error(
            "IndexedDB error:",
            request.error
          );
          reject(
            request.error
          );
        };
    }
  );
  return dbPromise;
}
/* =====================================================
   IMAGE DATABASE HELPERS
===================================================== */
async function saveImageToDB(
  dataURL
) {
  const db =
    await openImageDB();
  const id =
    "img_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2, 10);
  return new Promise(
    (resolve, reject) => {
      const transaction =
        db.transaction(
          IMAGE_STORE,
          "readwrite"
        );
      const store =
        transaction.objectStore(
          IMAGE_STORE
        );
      const request =
        store.put({
          id: id,
          data: dataURL
        });
      request.onsuccess =
        function() {
          resolve(
            "indexeddb://" + id
          );
        };
      request.onerror =
        function() {
          reject(
            request.error
          );
        };
    }
  );
}
async function getImageFromDB(
  id
) {
  const db =
    await openImageDB();
  return new Promise(
    (resolve, reject) => {
      const transaction =
        db.transaction(
          IMAGE_STORE,
          "readonly"
        );
      const store =
        transaction.objectStore(
          IMAGE_STORE
        );
      const request =
        store.get(id);
      request.onsuccess =
        function() {
          resolve(
            request.result
              ? request.result.data
              : null
          );
        };
      request.onerror =
        function() {
          reject(
            request.error
          );
        };
    }
  );
}
async function deleteImageFromDB(
  id
) {
  const db =
    await openImageDB();
  return new Promise(
    (resolve, reject) => {
      const transaction =
        db.transaction(
          IMAGE_STORE,
          "readwrite"
        );
      const store =
        transaction.objectStore(
          IMAGE_STORE
        );
      const request =
        store.delete(id);
      request.onsuccess =
        function() {
          resolve(true);
        };
      request.onerror =
        function() {
          reject(
            request.error
          );
        };
    }
  );
}
/* =====================================================
   RESOLVE IMAGE
===================================================== */
async function resolveImageSource(
  src
) {
  if (!src) {
    return "";
  }
  if (
    typeof src === "string" &&
    src.startsWith("indexeddb://")
  ) {
    const id =
      src.replace(
        "indexeddb://",
        ""
      );
    return await getImageFromDB(
      id
    );
  }
  return src;
}
/* =====================================================
   LOCAL STORAGE
===================================================== */
function saveLocalStorage() {
  try {
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(projects)
    );
    return true;
  } catch (error) {
    console.error(
      "ATELIER storage error:",
      error
    );
    showToast(
      "Could not save project"
    );
    return false;
  }
}
function saveLocal() {
  saveLocalStorage();
  showToast(
    "Project saved ✓"
  );
}
/* =====================================================
   HOME — PROJECTS
===================================================== */

===================================================== */
async function loadIndexedDBImages() {
  const images =
    document.querySelectorAll(
      "img[data-db-image]"
    );
  for (
    const img of images
  ) {
    const src =
      img.getAttribute(
        "data-db-image"
      );
    try {
      const data =
        await resolveImageSource(
          src
        );
      if (data) {
        img.src =
          data;
      }
    } catch (error) {
      console.error(
        "Could not load image:",
        error
      );
    }
  }
}

/* =====================================================
   COMPRESS IMAGE
===================================================== */
function compressImage(
  file
) {
  return new Promise(
    (resolve, reject) => {
      const reader =
        new FileReader();
      reader.onload =
        function(event) {
          const img =
            new Image();
          img.onload =
            function() {
              const MAX_SIZE =
                1600;
              let width =
                img.width;
              let height =
                img.height;
              if (
                width > MAX_SIZE ||
                height > MAX_SIZE
              ) {
                if (
                  width > height
                ) {
                  height =
                    Math.round(
                      height *
                      MAX_SIZE /
                      width
                    );
                  width =
                    MAX_SIZE;
                } else {
                  width =
                    Math.round(
                      width *
                      MAX_SIZE /
                      height
                    );
                  height =
                    MAX_SIZE;
                }
              }
              const canvas =
                document.createElement(
                  "canvas"
                );
              canvas.width =
                width;
              canvas.height =
                height;
              const ctx =
                canvas.getContext(
                  "2d"
                );
              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );
              const result =
                canvas.toDataURL(
                  "image/jpeg",
                  0.80
                );
              resolve(
                result
              );
            };
          img.onerror =
            function() {
              reject(
                new Error(
                  "Could not load image"
                )
              );
            };
          img.src =
            event.target.result;
        };
      reader.onerror =
        function() {
          reject(
            new Error(
              "Could not read file"
            )
          );
        };
      reader.readAsDataURL(
        file
      );
    }
  );
}
/* =====================================================
   ADD CONTENT
===================================================== */
async function addContent(
  sectionIndex
) {
  if (
    currentProject === null ||
    !projects[currentProject]
  ) {
    return;
  }
  const section =
    SECTION_TYPES[
      sectionIndex
    ];
  const urlInput =
    document.getElementById(
      "content-url"
    );
  const fileInput =
    document.getElementById(
      "content-file"
    );
  const url =
    urlInput
      ? urlInput.value.trim()
      : "";
  const files =
    fileInput &&
    fileInput.files
      ? Array.from(
          fileInput.files
        )
      : [];
  /* ---------------------------------
     FILE UPLOAD
  --------------------------------- */
  if (files.length) {
    const button =
      document.getElementById(
        "confirm-add-content"
      );
    if (button) {
      button.disabled =
        true;
      button.textContent =
        "Processing...";
    }
    let added = 0;
    try {
      for (
        const file of files
      ) {
        if (
          !file.type.startsWith(
            "image/"
          )
        ) {
          continue;
        }
        const compressed =
          await compressImage(
            file
          );
        const dbId =
          await saveImageToDB(
            compressed
          );
        projects[
          currentProject
        ]
        .sections[
          section
        ]
        .push(
          dbId
        );
        added++;
      }
      saveLocalStorage();
      closeModal();
      renderSections();
      showToast(
        `${added} image${added !== 1 ? "s" : ""} added ✓`
      );
    } catch (error) {
      console.error(
        "Image upload error:",
        error
      );
      showToast(
        "Could not save image"
      );
    } finally {
      if (button) {
        button.disabled =
          false;
        button.textContent =
          "Add";
      }
    }
    return;
  }
  /* ---------------------------------
     URL IMAGE
  --------------------------------- */
  if (url) {
    projects[
      currentProject
    ]
    .sections[
      section
    ]
    .push(
      url
    );
    saveLocalStorage();
    closeModal();
    renderSections();
    showToast(
      `${section} — image added ✓`
    );
    return;
  }
  showToast(
    "Choose an image or enter an URL"
  );
}
/* =====================================================
   REMOVE IMAGE
===================================================== */
async function removePhoto(
  sectionIndex,
  imageIndex
) {
  const section =
    SECTION_TYPES[
      sectionIndex
    ];
  if (
    !projects[
      currentProject
    ] ||
    !projects[
      currentProject
    ].sections[
      section
    ]
  ) {
    return;
  }
  const image =
    projects[
      currentProject
    ]
    .sections[
      section
    ][
      imageIndex
    ];
  if (
    typeof image === "string" &&
    image.startsWith(
      "indexeddb://"
    )
  ) {
    try {
      await deleteImageFromDB(
        image.replace(
          "indexeddb://",
          ""
        )
      );
    } catch (error) {
      console.error(
        error
      );
    }
  }
  projects[
    currentProject
  ]
  .sections[
    section
  ]
  .splice(
    imageIndex,
    1
  );
  saveLocalStorage();
  renderSections();
  showToast(
    "Image removed ✓"
  );
}

          value || ""
        )}"
      >
    </div>
  `;
}
function previewCoverImage(
  event
) {
  const file =
    event.target.files[0];
  if (!file) {
    return;
  }
  const reader =
    new FileReader();
  reader.onload =
    function(e) {
      const preview =
        document.getElementById(
          "cover-preview"
        );
      preview.innerHTML = `
        <img
          src="${e.target.result}"
          style="
            width:100%;
            height:100%;
            object-fit:cover;
            cursor:pointer;
          "
        >
      `;
      preview.dataset.image =
        e.target.result;
      const img =
        preview.querySelector(
          "img"
        );
      if (img) {
        img.addEventListener(
          "click",
          function(event) {
            event.stopPropagation();
            openImage(
              this.src
            );
          }
        );
      }
    };
  reader.readAsDataURL(
    file
  );
}

/* =====================================================
   CLIENT PREVIEW
===================================================== */
async function previewClient() {
  const p =
    projects[
      currentProject
    ];
  const html =
    await createClientHTML(
      p
    );
  const win =
    window.open();
  if (!win) {
    showToast(
      "Allow pop-ups for preview"
    );
    return;
  }
  win.document.open();
  win.document.write(
    html
  );
  win.document.close();
}
/* =====================================================
   EXPORT HTML
===================================================== */
async function exportHTML() {
  const p =
    projects[
      currentProject
    ];
  showToast(
    "Preparing HTML..."
  );
  const html =
    await createClientHTML(
      p
    );
  const blob =
    new Blob(
      [html],
      {
        type:
          "text/html;charset=utf-8"
      }
    );
  const url =
    URL.createObjectURL(
      blob
    );
  const a =
    document.createElement(
      "a"
    );
  a.href =
    url;
  a.download =
    safeFilename(
      p.name
    ) +
    ".html";
  document.body.appendChild(
    a
  );
  a.click();
  a.remove();
  setTimeout(
    () => {
      URL.revokeObjectURL(
        url
      );
    },
    1000
  );
  showToast(
    "Interactive HTML exported ✓"
  );
}

/* =====================================================

===================================================== */
function showToast(
  message
) {
  const toast =
    document.getElementById(
      "toast"
    );
  if (!toast) {
    return;
  }
  toast.textContent =
    message;
  toast.classList.add(
    "show"
  );
  setTimeout(
    () => {
      toast.classList.remove(
        "show"
      );
    },
    2200
  );

/* =====================================================
   CLIENT HTML
===================================================== */
async function createClientHTML(
  p
) {
  let sectionsHTML = "";
  for (
    let index = 0;
    index < SECTION_TYPES.length;
    index++
  ) {
    const section =
      SECTION_TYPES[index];
    const images =
      p.sections[
        section
      ] || [];
    if (
      images.length === 0 &&
      section !== "Notes"
    ) {
      continue;
    }
    let imageHTML = "";
    for (
      const image of images
    ) {
      const resolved =
        await resolveImageSource(
          image
        );
      imageHTML += `
        <div
          class="image"
          onclick="
            openImage(
              this.querySelector('img').src
            )
          "
        >
          <img
            src="${escapeAttribute(
              resolved
            )}"
            alt="${escapeAttribute(
              section
            )}"
          >
        </div>
      `;
    }
    sectionsHTML += `
      <section class="section">
        <div class="number">
          ${String(
            index + 1
          ).padStart(2, "0")}
          /
          ${escapeHTML(
            section
          )}
        </div>
        <h2>
          ${escapeHTML(
            section
          )}
        </h2>
        ${
          images.length
            ? `
              <div class="gallery">
                ${imageHTML}
              </div>
            `
            : `
              <p class="empty">
                Project notes and information.
              </p>
            `
        }
      </section>
    `;
  }
  return `

function openImage(src) {
  const img =
    document.getElementById(
      "lightbox-img"
    );
  const lightbox =
    document.getElementById(
      "lightbox"
    );
  if (
    !img ||
    !lightbox ||
    !src
  ) {
    return;
  }
  img.src =
    src;
  lightbox.classList.add(
    "active"
  );
  document.body.style.overflow =
    "hidden";
}
function closeImage(event) {
  if (
    event &&
    event.target &&
    event.target.id !==
      "lightbox" &&
    !event.target.classList.contains(
      "close"
    )
  ) {
    return;
  }
  const lightbox =
    document.getElementById(
      "lightbox"
    );
  const img =
    document.getElementById(
      "lightbox-img"
    );
  if (lightbox) {
    lightbox.classList.remove(

    );

  if (img) {
    img.src = "";
  }
  document.body.style.overflow =
    "";
}

);

      </svg>
    `)}
  `;

function escapeHTML(
  value
) {
  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}
function escapeAttribute(
  value
) {
  return escapeHTML(
    value
  );
}
function safeFilename(
  value
) {
  return String(
    value ||
    "project"
  )
    .replace(
      /[^a-z0-9ăâîșț \-_]/gi,
      ""
    )
    .trim()
    .replace(
      /\s+/g,
      "-"
    )
    .toLowerCase();
}
