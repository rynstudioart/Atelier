<!doctype html>
<html lang="ro">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Atelier — Interior Design Studio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>

  <style>

    :root {
      --black: #242220;
      --gray: #77736d;
      --light-gray: #e9e7e3;
      --very-light: #f8f7f5;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: var(--black);
      font-family: "DM Sans", sans-serif;
    }

    h1,
    h2,
    h3,
    .elegant-title {
      font-family: "Cormorant Garamond", serif;
      font-weight: 500;
    }


    /* --------------------------------
       MAIN PAGE
    -------------------------------- */

    #main-view {
      min-height: 100vh;
      background: #ffffff;
    }

    .main-header {
      text-align: center;
      padding-top: 70px;
      margin-bottom: 45px;
    }

    .logo {
      font-family: "DM Sans", sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #242220;
      margin-bottom: 24px;
    }

    .main-title {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(48px, 7vw, 72px);
      line-height: 0.95;
      font-weight: 500;
      letter-spacing: -0.025em;
      margin: 0;
    }

    .main-subtitle {
      margin-top: 13px;
      font-size: 13px;
      color: var(--gray);
      letter-spacing: 0.04em;
    }


    /* --------------------------------
       NEW PROJECT BUTTON
    -------------------------------- */

    .new-project-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 55px;
    }

    .new-project-button {
      display: inline-flex;
      align-items: center;
      gap: 10px;

      background: #242220;
      color: white;

      border: none;
      border-radius: 999px;

      padding: 14px 27px;

      font-size: 13px;
      font-weight: 500;

      transition: all .2s ease;
      cursor: pointer;
    }

    .new-project-button:hover {
      background: #3c3935;
      transform: translateY(-1px);
    }


    /* --------------------------------
       ADD PROJECT FORM
    -------------------------------- */

    .add-project-form {
      max-width: 420px;
      margin: 0 auto 45px;
    }

    .add-project-form input {
      width: 100%;
      border: 1px solid var(--light-gray);
      border-radius: 10px;
      padding: 13px 15px;
      outline: none;
      font-size: 13px;
      background: white;
    }

    .add-project-form input:focus {
      border-color: #aaa69f;
    }


    /* --------------------------------
       PROJECT GRID
    -------------------------------- */

    #projects-grid {
      padding-bottom: 100px;
    }

    .project-card {
      position: relative;
      background: white;
      border: 1px solid var(--light-gray);
      border-radius: 15px;
      overflow: hidden;
      cursor: pointer;
      transition: all .25s ease;
    }

    .project-card:hover {
      border-color: #d0cdc7;
      transform: translateY(-3px);
      box-shadow: 0 15px 35px rgba(0,0,0,.06);
    }

    .project-cover {
      width: 100%;
      height: 230px;
      background: #f3f2ef;
      overflow: hidden;
    }

    .project-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .4s ease;
    }

    .project-card:hover .project-cover img {
      transform: scale(1.03);
    }

    .project-card-content {
      padding: 20px;
    }

    .project-card-title {
      font-family: "Cormorant Garamond", serif;
      font-size: 25px;
      font-weight: 500;
      margin-bottom: 5px;
    }

    .project-card-info {
      color: #88847d;
      font-size: 12px;
    }

    .project-card-status {
      display: inline-block;
      margin-top: 13px;
      padding: 5px 9px;
      border-radius: 999px;
      background: #f4f2ef;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #6e6a64;
    }


    /* --------------------------------
       DETAIL VIEW
    -------------------------------- */

    #detail-view {
      min-height: 100vh;
      background: white;
    }

    .detail-header {
      padding: 35px 0 45px;
      border-bottom: 1px solid var(--light-gray);
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #77736d;
      font-size: 12px;
      border: none;
      background: transparent;
      padding: 0;
      margin-bottom: 30px;
      cursor: pointer;
    }

    .back-button:hover {
      color: #242220;
    }

    .detail-title {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(42px, 6vw, 64px);
      line-height: 1;
      margin: 0;
    }

    .detail-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 25px;
      margin-top: 17px;
      color: #817d76;
      font-size: 12px;
    }

    .detail-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 28px;
    }

    .action-button {
      border: 1px solid var(--light-gray);
      background: white;
      border-radius: 999px;
      padding: 9px 15px;
      font-size: 12px;
      color: #44413d;
      transition: .2s;
      cursor: pointer;
    }

    .action-button:hover {
      background: #f7f6f3;
    }

    .action-button.dark {
      background: #242220;
      color: white;
      border-color: #242220;
    }


    /* --------------------------------
       SECTION
    -------------------------------- */

    .project-section {
      padding: 60px 0;
      border-bottom: 1px solid var(--light-gray);
    }

    .section-number {
      font-size: 10px;
      color: #99958e;
      letter-spacing: .18em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .section-title {
      font-family: "Cormorant Garamond", serif;
      font-size: 34px;
      margin: 0;
    }


    /* --------------------------------
       SECTION HEADER + PLUS
    -------------------------------- */

    .section-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    .section-header-left {
      min-width: 0;
    }

    .section-add-button {
      flex: 0 0 auto;

      width: 42px;
      height: 42px;

      border-radius: 50%;

      border: 1px solid #d8d5cf;
      background: white;

      color: #77736d;

      font-size: 24px;
      font-weight: 300;

      line-height: 1;

      cursor: pointer;

      transition: all .2s ease;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .section-add-button:hover {
      background: #242220;
      color: white;
      border-color: #242220;
      transform: translateY(-1px);
    }


    /* --------------------------------
       IMAGE GRID
    -------------------------------- */

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 0;
    }

    .photo-item {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: #f5f4f1;
      aspect-ratio: 1;
      cursor: pointer;
    }

    .photo-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .3s ease;
    }

    .photo-item:hover img {
      transform: scale(1.04);
    }


    /* --------------------------------
       SKETCH + RENDER
       HORIZONTAL SCROLL
    -------------------------------- */

    .horizontal-scroll-grid {
      display: flex;

      gap: 16px;

      overflow-x: auto;
      overflow-y: hidden;

      padding-bottom: 12px;

      scroll-behavior: smooth;

      scrollbar-width: thin;
      scrollbar-color: #c8c5bf transparent;
    }

    .horizontal-scroll-grid::-webkit-scrollbar {
      height: 6px;
    }

    .horizontal-scroll-grid::-webkit-scrollbar-track {
      background: transparent;
    }

    .horizontal-scroll-grid::-webkit-scrollbar-thumb {
      background: #c8c5bf;
      border-radius: 20px;
    }

    .horizontal-scroll-grid .photo-item {
      flex: 0 0 520px;

      width: 520px;
      height: 330px;

      aspect-ratio: auto;
    }


    /* --------------------------------
       TECHNICAL DRAWINGS
    -------------------------------- */

    .technical-drawings-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }


    /* --------------------------------
       REMOVE PHOTO
    -------------------------------- */

    .remove-photo {
      position: absolute;

      top: 7px;
      right: 7px;

      width: 25px;
      height: 25px;

      border-radius: 50%;
      border: none;

      background: rgba(20,20,20,.75);
      color: white;

      display: none;

      align-items: center;
      justify-content: center;

      font-size: 12px;

      cursor: pointer;

      z-index: 3;
    }

    .photo-item:hover .remove-photo {
      display: flex;
    }


    /* --------------------------------
       PALETTE
    -------------------------------- */

    .palette {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    .color-item {
      text-align: center;
      width: 85px;
    }

    .color-circle {
      width: 70px;
      height: 70px;
      margin: 0 auto 8px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,.08);
    }

    .color-name {
      font-size: 11px;
      color: #5f5b55;
    }

    .color-code {
      font-size: 9px;
      color: #aaa69f;
      margin-top: 3px;
    }


    /* --------------------------------
       MATERIAL CARDS
    -------------------------------- */

    .material-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .material-card {
      border: 1px solid var(--light-gray);
      border-radius: 14px;
      overflow: hidden;
      background: white;
    }

    .material-image {
      height: 180px;
      background: #f3f2ef;
    }

    .material-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .material-content {
      padding: 15px;
    }

    .material-title {
      font-family: "Cormorant Garamond", serif;
      font-size: 21px;
    }

    .material-info {
      color: #89857e;
      font-size: 11px;
      margin-top: 4px;
    }


    /* --------------------------------
       MODAL
    -------------------------------- */

    .modal {
      position: fixed;
      inset: 0;

      z-index: 100;

      display: none;

      align-items: center;
      justify-content: center;

      background: rgba(25,23,21,.45);

      padding: 20px;
    }

    .modal.active {
      display: flex;
    }

    .modal-box {
      width: min(560px, 100%);

      max-height: 90vh;

      overflow-y: auto;

      background: white;

      border-radius: 18px;

      padding: 28px;

      box-shadow: 0 25px 80px rgba(0,0,0,.15);
    }

    .modal-title {
      font-family: "Cormorant Garamond", serif;

      font-size: 31px;

      margin-bottom: 22px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;

      font-size: 10px;

      text-transform: uppercase;

      letter-spacing: .1em;

      color: #85817a;

      margin-bottom: 7px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;

      border: 1px solid var(--light-gray);

      border-radius: 9px;

      padding: 11px 12px;

      font-size: 13px;

      outline: none;

      background: white;
    }

    .form-group textarea {
      min-height: 100px;

      resize: vertical;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: #aaa69f;
    }

    .modal-actions {
      display: flex;

      justify-content: flex-end;

      gap: 8px;

      margin-top: 22px;
    }


    /* --------------------------------
       FULL IMAGE POPUP
    -------------------------------- */

    .image-modal {
      position: fixed;

      inset: 0;

      z-index: 9999;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 30px;

      background: rgba(20,18,16,.88);
    }

    .image-modal.active {
      display: flex;
    }

    .image-modal-content {
      position: relative;

      max-width: 95vw;
      max-height: 92vh;

      display: flex;

      align-items: center;
      justify-content: center;
    }

    .image-modal-content img {
      max-width: 95vw;
      max-height: 92vh;

      width: auto;
      height: auto;

      object-fit: contain;

      border-radius: 6px;

      box-shadow: 0 20px 80px rgba(0,0,0,.3);
    }

    .image-modal-close {
      position: fixed;

      top: 25px;
      right: 30px;

      width: 42px;
      height: 42px;

      border: none;
      border-radius: 50%;

      background: rgba(255,255,255,.12);

      color: white;

      font-size: 25px;

      cursor: pointer;

      display: flex;

      align-items: center;
      justify-content: center;

      z-index: 10000;
    }

    .image-modal-close:hover {
      background: rgba(255,255,255,.22);
    }


    /* --------------------------------
       TOAST
    -------------------------------- */

    #toast {
      position: fixed;

      bottom: 25px;
      right: 25px;

      background: #242220;

      color: white;

      padding: 11px 17px;

      border-radius: 999px;

      font-size: 12px;

      opacity: 0;

      transform: translateY(10px);

      pointer-events: none;

      transition: .25s;

      z-index: 200;
    }

    #toast.show {
      opacity: 1;

      transform: translateY(0);
    }


    /* --------------------------------
       MOBILE
    -------------------------------- */

    @media(max-width:700px) {

      .main-header {
        padding-top: 45px;
      }

      .photo-grid,
      .technical-drawings-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .material-grid {
        grid-template-columns: 1fr;
      }

      .detail-meta {
        gap: 12px;
      }

      .project-section {
        padding: 45px 0;
      }

      .project-cover {
        height: 210px;
      }

      .horizontal-scroll-grid .photo-item {
        flex: 0 0 85vw;

        width: 85vw;

        height: 55vw;
      }

    }

  </style>
</head>


<body>


<!-- =====================================================
     HOME
===================================================== -->

<div id="main-view">

  <main class="max-w-5xl mx-auto px-6">

    <header class="main-header">

      <div class="logo">
        ATELIER
      </div>

      <h1 class="main-title">
        My Projects
      </h1>

      <p class="main-subtitle">
        Interior Design Studio
      </p>

    </header>


    <div class="new-project-wrapper">

      <button
        class="new-project-button"
        onclick="showAddProject()"
      >

        <span style="font-size:18px;">
          +
        </span>

        New Project

      </button>

    </div>


    <div
      id="add-project-form"
      class="add-project-form hidden"
    >

      <div class="flex gap-2">

        <input
          id="new-project-name"
          type="text"
          placeholder="Nume proiect..."
          onkeydown="if(event.key==='Enter') createProject()"
        >

        <button
          onclick="createProject()"
          class="action-button dark"
        >
          Create
        </button>

        <button
          onclick="hideAddProject()"
          class="action-button"
        >
          Cancel
        </button>

      </div>

    </div>


    <div
      id="projects-grid"
      class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-5 pb-24"
    ></div>

  </main>

</div>



<!-- =====================================================
     DETAIL VIEW
===================================================== -->

<div
  id="detail-view"
  class="hidden"
>

  <main class="max-w-5xl mx-auto px-6">

    <header class="detail-header">

      <button
        onclick="goBack()"
        class="back-button"
      >

        <i data-lucide="arrow-left"></i>

        Back to projects

      </button>


      <h1
        id="detail-project-name"
        class="detail-title"
      ></h1>


      <div
        id="detail-meta"
        class="detail-meta"
      ></div>


      <div class="detail-actions">

        <button
          onclick="saveLocal()"
          class="action-button"
        >
          Save
        </button>


        <button
          onclick="openProjectEdit()"
          class="action-button"
        >
          Edit Project
        </button>


        <button
          onclick="previewClient()"
          class="action-button"
        >
          Preview Client
        </button>


        <button
          onclick="exportHTML()"
          class="action-button dark"
        >
          Export Interactive HTML
        </button>


        <button
          onclick="exportJSON()"
          class="action-button"
        >
          Export JSON
        </button>

      </div>

    </header>


    <div
      id="sections-container"
    ></div>

  </main>

</div>



<!-- =====================================================
     ADD / EDIT MODAL
===================================================== -->

<div
  id="modal"
  class="modal"
  onclick="closeModalOutside(event)"
>

  <div
    id="modal-box"
    class="modal-box"
  ></div>

</div>



<!-- =====================================================
     IMAGE FULLSCREEN POPUP
===================================================== -->

<div
  id="image-modal"
  class="image-modal"
  onclick="closeImageModal(event)"
>

  <button
    class="image-modal-close"
    onclick="closeImageModal(event)"
  >
    ×
  </button>


  <div class="image-modal-content">

    <img
      id="image-modal-img"
      src=""
      alt="Preview"
      onclick="event.stopPropagation()"
    >

  </div>

</div>



<div id="toast"></div>



<script>

/* =====================================================
   PROJECT STRUCTURE
===================================================== */

const STORAGE_KEY = "atelier-interior-projects";

const SECTION_TYPES = [
  "Moodboard",
  "Sketch",
  "Reference",
  "Texture",
  "Palette Color",
  "Materials",
  "Furniture",
  "Technical Drawings",
  "Lighting",
  "Render Drawings",
  "Notes"
];

let projects =
  JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

let currentProject = null;


/* =====================================================
   STORAGE
===================================================== */

function saveLocalStorage() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(projects)
  );

}

function saveLocal() {

  saveLocalStorage();

  showToast("Project saved ✓");

}


/* =====================================================
   HOME
===================================================== */

function renderProjects() {

  const grid =
    document.getElementById("projects-grid");

  if (!grid) return;

  grid.innerHTML = "";

  projects.forEach((project, index) => {

    const card =
      document.createElement("article");

    card.className = "project-card";

    card.addEventListener("click", function () {
      openProject(index);
    });

    const totalImages =
      Object.values(project.sections || {})
        .reduce(
          (total, arr) =>
            total + (Array.isArray(arr) ? arr.length : 0),
          0
        );

    card.innerHTML = `

      <div class="project-cover">

        <img
          src="${escapeAttribute(project.cover || placeholderImage())}"
          alt="${escapeAttribute(project.name)}"
        >

      </div>

      <div class="project-card-content">

        <div class="project-card-title">
          ${escapeHTML(project.name)}
        </div>

        <div class="project-card-info">
          ${escapeHTML(project.client || "Client")}
        </div>

        <div class="project-card-info">
          ${escapeHTML(project.location || "")}
          ${
            project.area
              ? " · " + escapeHTML(project.area)
              : ""
          }
        </div>

        <div class="project-card-status">
          ${escapeHTML(project.status || "Concept")}
        </div>

      </div>

    `;

    grid.appendChild(card);

  });

}


/* =====================================================
   NEW PROJECT
===================================================== */

function showAddProject() {

  document
    .getElementById("add-project-form")
    .classList.remove("hidden");

  document
    .getElementById("new-project-name")
    .focus();

}


function hideAddProject() {

  document
    .getElementById("add-project-form")
    .classList.add("hidden");

}


function createProject() {

  const input =
    document.getElementById("new-project-name");

  const name =
    input.value.trim();

  if (!name) return;

  const sections = {};

  SECTION_TYPES.forEach(section => {
    sections[section] = [];
  });

  projects.push({

    id: Date.now(),

    name,

    client: "",

    location: "",

    area: "",

    type: "Interior Design",

    status: "Concept",

    description: "",

    cover: "",

    sections

  });

  saveLocalStorage();

  input.value = "";

  hideAddProject();

  renderProjects();

}


/* =====================================================
   OPEN PROJECT
===================================================== */

function openProject(index) {

  currentProject = index;

  const project =
    projects[index];

  document
    .getElementById("main-view")
    .classList.add("hidden");

  document
    .getElementById("detail-view")
    .classList.remove("hidden");

  document
    .getElementById("detail-project-name")
    .textContent =
    project.name;

  document
    .getElementById("detail-meta")
    .innerHTML = `

      <span>
        ${escapeHTML(project.client || "No client")}
      </span>

      <span>
        ${escapeHTML(project.location || "No location")}
      </span>

      <span>
        ${escapeHTML(project.area || "No area")}
      </span>

      <span>
        ${escapeHTML(project.status || "Concept")}
      </span>

    `;

  /*
     IMPORTANT:
     Make sure every section exists.
  */

  SECTION_TYPES.forEach(section => {

    if (!Array.isArray(project.sections[section])) {
      project.sections[section] = [];
    }

  });

  renderSections();

  window.scrollTo(0, 0);

  if (window.lucide) {
    lucide.createIcons();
  }

}


function goBack() {

  document
    .getElementById("detail-view")
    .classList.add("hidden");

  document
    .getElementById("main-view")
    .classList.remove("hidden");

  currentProject = null;

  renderProjects();

  window.scrollTo(0, 0);

}


/* =====================================================
   RENDER SECTIONS
===================================================== */

function renderSections() {

  const container =
    document.getElementById("sections-container");

  if (!container) return;

  container.innerHTML = "";

  const project =
    projects[currentProject];

  SECTION_TYPES.forEach((section, index) => {

    if (!project.sections[section]) {
      project.sections[section] = [];
    }

    const images =
      project.sections[section];

    const sectionElement =
      document.createElement("section");

    sectionElement.className =
      "project-section";

    /*
       IMPORTANT:
       The + button is now identified using
       data-section-index instead of inline onclick.
    */

    sectionElement.innerHTML = `

      <div class="section-number">
        ${String(index + 1).padStart(2, "0")} /
        ${escapeHTML(section)}
      </div>

      <div
        style="
          display:flex;
          align-items:center;
          justify-content:space-between;
          gap:20px;
          margin-bottom:22px;
        "
      >

        <h2
          class="section-title"
          style="margin:0;"
        >
          ${escapeHTML(section)}
        </h2>

        <button
          type="button"
          class="add-content-button"
          data-add-section="${index}"
          title="Add content"
          aria-label="Add content to ${escapeAttribute(section)}"
        >
          +
        </button>

      </div>

      <div
        class="photo-grid"
        id="grid-${index}"
      >

        ${
          images.length
            ? images.map((image, imageIndex) => `

                <div
                  class="photo-item"
                  data-image="${escapeAttribute(image)}"
                >

                  <img
                    src="${escapeAttribute(image)}"
                    alt="${escapeAttribute(section)}"
                  >

                  <button
                    type="button"
                    class="remove-photo"
                    data-remove-section="${index}"
                    data-remove-image="${imageIndex}"
                  >
                    ×
                  </button>

                </div>

              `).join("")
            : ""
        }

      </div>

    `;

    container.appendChild(sectionElement);

  });

  /*
     Attach events AFTER the sections are created.
  */

  attachSectionEvents();

}


/* =====================================================
   SECTION EVENTS
===================================================== */

function attachSectionEvents() {

  /*
     ADD BUTTONS
  */

  document
    .querySelectorAll("[data-add-section]")
    .forEach(button => {

      button.addEventListener("click", function(event) {

        event.preventDefault();

        event.stopPropagation();

        const sectionIndex =
          Number(
            this.getAttribute("data-add-section")
          );

        openAddContent(sectionIndex);

      });

    });


  /*
     REMOVE BUTTONS
  */

  document
    .querySelectorAll("[data-remove-section]")
    .forEach(button => {

      button.addEventListener("click", function(event) {

        event.preventDefault();

        event.stopPropagation();

        const sectionIndex =
          Number(
            this.getAttribute("data-remove-section")
          );

        const imageIndex =
          Number(
            this.getAttribute("data-remove-image")
          );

        removePhoto(
          sectionIndex,
          imageIndex
        );

      });

    });


  /*
     IMAGE CLICK
  */

  document
    .querySelectorAll(".photo-item")
    .forEach(item => {

      item.addEventListener("click", function(event) {

        /*
           Do not open the image when clicking X.
        */

        if (
          event.target.closest(".remove-photo")
        ) {
          return;
        }

        const image =
          this.getAttribute("data-image");

        if (image) {
          openImage(image);
        }

      });

    });

}

function openAddContent(sectionIndex) {

  const section =

  const modal =

  const modalBox =

  if (!modal || !modalBox) {

    </div>

    >

        Or choose an image
      </label>

      <input
        id="content-file"
        type="file"
        accept="image/*"
      >

    </div>

    <div

      style="
        display:none;
        margin-top:10px;
        margin-bottom:15px;

        overflow:hidden;

        class="action-button dark"

      </button>

    </div>

  `;

  modal.classList.add("active");


  /*
     Cancel
  */

  document
    .getElementById("cancel-add-content")
    .addEventListener("click", function() {

      closeModal();

    });


  /*
     ADD
  */

  document

    .addEventListener("click", function() {

      addContent(sectionIndex);

    });


  /*

  */

  document

    .addEventListener("change", function() {

      const file =
        this.files[0];

      if (!file) return;

      const reader =
        new FileReader();

      reader.onload = function(event) {

        const preview =
          document.getElementById(
            "image-upload-preview"
          );

        preview.style.display = "block";

        preview.innerHTML = `

            src="${event.target.result}"
            style="
              width:100%;
              max-height:250px;
              object-fit:contain;
              display:block;
            "

      };

      reader.readAsDataURL(file);

    });


  /*

  document
    .getElementById("content-url")
    .focus();

}


/* =====================================================
   ADD CONTENT
===================================================== */

function addContent(sectionIndex) {

  if (
    currentProject === null ||
    !projects[currentProject]
  ) {
    return;
  }

  const section =
    SECTION_TYPES[sectionIndex];

  const urlInput =
    document.getElementById("content-url");

  const fileInput =
    document.getElementById("content-file");

  const url =
    urlInput
      ? urlInput.value.trim()
      : "";

  const file =
    fileInput &&
    fileInput.files
      ? fileInput.files[0]
      : null;


  /*
     FILE UPLOAD
  */

  if (file) {

    const reader =
      new FileReader();

    reader.onload = function(event) {

      projects[currentProject]
        .sections[section]
        .push(event.target.result);

      saveLocalStorage();

      closeModal();

      renderSections();

      showToast(
        `${section} — image added ✓`
      );

    };

    reader.onerror = function() {

      showToast(
        "Could not read image"
      );

    };

    reader.readAsDataURL(file);

    return;
  }


  /*
     URL
  */

  if (url) {

    projects[currentProject]
      .sections[section]
      .push(url);

    saveLocalStorage();

    closeModal();

    renderSections();

    showToast(
      `${section} — image added ✓`
    );

    return;
  }


  /*
     NOTHING SELECTED
  */

  showToast(
    "Choose an image or enter an URL"
  );

}


/* =====================================================
   REMOVE IMAGE
===================================================== */

function removePhoto(
  sectionIndex,
  imageIndex
) {

  const section =
    SECTION_TYPES[sectionIndex];

  if (
    !projects[currentProject] ||
    !projects[currentProject].sections[section]
  ) {
    return;
  }

  projects[currentProject]
    .sections[section]
    .splice(imageIndex, 1);

  saveLocalStorage();

  renderSections();

  showToast("Image removed ✓");

}

function formField(
  label,
  id,
  value
) {

  return `

}


function previewCoverImage(event) {

  const file =
    event.target.files[0];

  if (!file) return;

  const reader =
    new FileReader();

  reader.onload = function(e) {

    const preview =
      document.getElementById(
        "cover-preview"
      );

    preview.innerHTML = `

      <img
        src="${e.target.result}"
        style="
          width:100%;
          height:100%;
          object-fit:cover;
        "
      >

    `;

    preview.dataset.image =
      e.target.result;

  };

  reader.readAsDataURL(file);

}

/* =====================================================
   EXPORT HTML
===================================================== */

function exportHTML() {

  const p =
    projects[currentProject];

  const html =
    createClientHTML(p);

  const blob =
    new Blob(
      [html],
      {
        type:
          "text/html;charset=utf-8"
      }
    );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;

  a.download =
    safeFilename(p.name) +
    ".html";

  document.body.appendChild(a);

  a.click();

  a.remove();

  setTimeout(() => {

    URL.revokeObjectURL(url);

  }, 1000);

  showToast(
    "Interactive HTML exported ✓"
  );

}

  a.download =

function placeholderImage() {

  return `
    data:image/svg+xml;charset=UTF-8,
    ${encodeURIComponent(`

      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="800"
        height="500"
      >

        <rect
          width="100%"
          height="100%"
          fill="#f3f2ef"
        />

        <text
          x="50%"
          y="50%"
          text-anchor="middle"
          dominant-baseline="middle"
          fill="#999"
          font-family="Arial"
          font-size="24"
        >
          ATELIER
        </text>

      </svg>

    `)}
  `;

}


function escapeHTML(value) {

  return String(value ?? "")

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeAttribute(value) {

  return escapeHTML(value);

}


function safeFilename(value) {

  return String(
    value || "project"
  )

    .replace(
      /[^a-z0-9ăâîșț \-_]/gi,
      ""
    )

    .trim()

    .replace(
      /\s+/g,
      "-"
    )

    .toLowerCase();

}
